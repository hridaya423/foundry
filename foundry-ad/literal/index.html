<!doctype html>

    <script>
      (function () {
        const clock = { t: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.to(clock, { t: TM.end, duration: TM.end, ease: "none", onUpdate: () => window.__renderAt && window.__renderAt(clock.t) }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines.main = tl;
      })();
    </script>
    <script type="importmap">

    <style>
      @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Noto JP"; src: url("assets/fonts/NotoSansJP-500-subset.woff2") format("woff2"); font-weight: 500; }
      :root { --ink: #0f0d0c; --text: #f4efe8; --secondary: #f4efe8b8; --tertiary: #f4efe87a; --accent: #fa6428; --pt: 1.3333px; }
      * { box-sizing: border-box; margin: 0; padding: 0; }

      #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
