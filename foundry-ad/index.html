<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Foundry — Through the dot</title>
    <script src="vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }
    </script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo-VF.ttf") format("truetype"); font-weight: 100 900; font-stretch: 62% 125%; }
      @font-face { font-family: "Plex Mono"; src: url("assets/fonts/IBMPlexMono-Regular.ttf"); font-weight: 400; }
      @font-face { font-family: "Plex Mono"; src: url("assets/fonts/IBMPlexMono-Medium.ttf"); font-weight: 500; }
      @font-face { font-family: "Plex Mono"; src: url("assets/fonts/IBMPlexMono-SemiBold.ttf"); font-weight: 600; }
      @font-face { font-family: "Noto JP"; src: url("assets/fonts/NotoSansJP-sub.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Noto SC"; src: url("assets/fonts/NotoSansSC-sub.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Noto Cyr"; src: url("assets/fonts/NotoSans-cyr.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 100%; }

      :root {
        --ink: #060505;
        --white: #f4f4f2;
        --molten: #ff5a1f;
        --hot: #ffd9ae;
        --sans: "Archivo", "Noto Cyr", "Noto JP", "Noto SC", sans-serif;
        --mono: "Plex Mono", monospace;
        --dot: radial-gradient(circle, #fff6ea 0%, #ffd9ae 26%, #ff7a3d 52%, #ff5a1f 70%);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1920px; height: 1080px; background: var(--ink); overflow: hidden; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); color: var(--white); font-family: var(--sans); }
      .fill { position: absolute; inset: 0; width: 100%; height: 100%; }
      .act { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
      video, img { display: block; }
      video.fill, img.fill { object-fit: cover; }
      .abs { position: absolute; }
      .paint { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }

      /* I: the tube */
      #a1 { background: #000; }
      #tube { position: absolute; overflow: hidden; background: #000; }
      #tubeon { transform-origin: 50% 50%; }
      #tube video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #tube .glass { position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        background: radial-gradient(120% 95% at 34% 22%, rgba(255,255,255,0.10), rgba(255,255,255,0) 42%),
                    radial-gradient(100% 100% at 50% 50%, rgba(0,0,0,0) 62%, rgba(0,0,0,0.55) 100%);
        box-shadow: inset 0 0 26px 6px rgba(0,0,0,0.85); }
      #pilot { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
        background: radial-gradient(circle, #fff 0 30%, rgba(255,240,225,0.8) 45%, rgba(255,217,174,0) 70%);
        box-shadow: 0 0 18px 6px rgba(220,235,255,0.45); }
      #a1 .flash { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

      /* the stage: every scene is a 1920x1080 frame the zoom engine transforms */
      .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; visibility: hidden;
        transform-origin: 0 0; background: var(--ink); box-shadow: 0 0 0 3000px var(--ink); }
      .scene.light { background: var(--white); color: var(--ink); box-shadow: 0 0 0 3000px var(--white); }
      .zdisk { position: absolute; left: 420px; top: 0; width: 1080px; height: 1080px; border-radius: 50%; background: var(--dot); opacity: 0; z-index: 50; }
      .zring { position: absolute; left: 420px; top: 0; width: 1080px; height: 1080px; border-radius: 50%; opacity: 0; z-index: 51;
        box-shadow: 0 0 0 10px rgba(255,90,31,0.9), 0 0 60px 24px rgba(255,90,31,0.45); }
      .dot { position: absolute; border-radius: 50%; background: var(--dot);
        box-shadow: 0 0 14px 3px rgba(255,90,31,0.55), 0 0 44px 10px rgba(255,90,31,0.22); }
      .verb { position: absolute; font-family: var(--sans); font-weight: 800; font-stretch: 75%; letter-spacing: -0.03em; white-space: pre; line-height: 1; }
      .mono { font-family: var(--mono); font-weight: 500; letter-spacing: 0.02em; }

      /* II: keys */
      #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #ms { position: absolute; left: 0; right: 0; top: 890px; text-align: center; font: 500 46px var(--mono); color: var(--white);
        font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
      #ms .u { color: rgba(244,244,242,0.5); margin-left: 0.3em; }

      /* 1 open */
      #s-open .feet { position: absolute; inset: 0; }
      #s-open .feet video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #s-open .caret { position: absolute; width: 26px; border-radius: 3px; background: var(--molten);
        box-shadow: 0 0 20px 4px rgba(255,90,31,0.5); }

      /* 2 convert */
      #s-convert .photo { position: absolute; left: 1010px; top: 90px; width: 675px; height: 900px; }
      #s-convert .photo img { position: absolute; inset: 0; width: 100%; height: 100%; visibility: hidden; }
      #s-convert .reel { position: absolute; left: 150px; top: 470px; width: 820px; height: 600px; overflow: hidden;
        -webkit-mask-image: linear-gradient(transparent 0%, #000 30%, #000 70%, transparent 100%); mask-image: linear-gradient(transparent 0%, #000 30%, #000 70%, transparent 100%); }
      #s-convert .strip { position: absolute; left: 0; top: 0; }
      #s-convert .item { height: 280px; font-family: var(--sans); font-weight: 800; font-stretch: 75%; font-size: 236px; line-height: 280px; letter-spacing: -0.03em; white-space: nowrap; }

      /* 3 paste */
      #s-paste .deck { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 50% 46%; }
      #s-paste .card { position: absolute; left: 700px; top: 190px; width: 520px; height: 660px; border-radius: 26px; overflow: hidden;
        background: #161617; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.14), 0 30px 60px rgba(0,0,0,0.6); transform-origin: 50% 100%;
        backface-visibility: hidden; }
      #s-paste .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.08); }
      #s-paste .card .tx { position: absolute; inset: 40px; font: 500 30px/1.45 var(--mono); color: rgba(244,244,242,0.82); white-space: pre-wrap; }
      #s-paste .card.sw { background: var(--molten); }
      #s-paste .card.sw .tx { color: var(--ink); }
      #s-paste .word { color: var(--white); text-shadow: 0 10px 40px rgba(0,0,0,0.45); }

      /* 4 speak */
      #s-speak .earth { position: absolute; left: 650px; top: 230px; width: 620px; height: 620px; filter: grayscale(1) contrast(1.1); }
      #s-speak .ringw { position: absolute; font-family: var(--sans); font-weight: 700; font-stretch: 85%; font-size: 92px; white-space: nowrap; color: var(--ink); }

      /* 5 snap */
      #s-snap .pane { position: absolute; overflow: hidden; border-radius: 10px; background: #0d0d0e; }
      #s-snap .pane video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(1.35) contrast(1.12); }
      #s-snap .seam { position: absolute; background: var(--molten); box-shadow: 0 0 16px 2px rgba(255,90,31,0.6); }

      /* end */
      #s-end .keys { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 18px; }
      .kc5 { position: relative; width: 112px; height: 112px; border-radius: 20px; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(#1b1b1d, #101011); color: var(--white);
        box-shadow: 0 7px 0 #000, 0 16px 34px rgba(0,0,0,0.7), inset 0 1.5px 0 rgba(255,255,255,0.2), inset 0 0 0 2px rgba(255,255,255,0.22); }
      .kc5.wide { width: 420px; justify-content: flex-start; align-items: flex-end; padding: 0 0 18px 22px; font: 500 30px var(--sans);
        font-stretch: 100%; color: rgba(244,244,242,0.9); }

      #whiteout { position: absolute; inset: 0; background: #fff; opacity: 0; }
      #grain { position: absolute; inset: -64px; background-image: url("assets/img/grain.png"); background-size: 512px 512px;
        mix-blend-mode: overlay; opacity: 0.14; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-fps="60" data-width="1920" data-height="1080">
      <!-- I — the tube -->
      <div id="a1" class="act">
        <div id="cam1" class="fill">
          <img id="tvoff" class="fill" src="assets/img/tv/tv-off.png" alt="" />
          <img id="tvlit" class="fill" src="assets/img/tv/tv-lit.png" alt="" />
          <div id="tube">
            <div id="tubeon" class="fill">
              <video id="v-sil" class="clip" src="assets/v/tube-silhouette.mp4" muted playsinline data-start="0.2" data-duration="0.6" data-media-start="0.1" data-track-index="1"></video>
              <video id="v-pour" class="clip" src="assets/v/tube-pour.mp4" muted playsinline data-start="0.8" data-duration="1.075" data-media-start="0" data-track-index="1"></video>
            </div>
            <div id="pilot"></div>
            <div class="glass"></div>
          </div>
        </div>
        <video id="v-flash1" class="clip flash" src="assets/v/flash-fireball.mp4" muted playsinline data-start="0.7833" data-duration="0.05" data-media-start="0.03" data-track-index="2"></video>
      </div>

      <div id="stage" class="fill">
        <!-- II — ⌥ Space -->
        <div id="s-keys" class="scene">
          <canvas id="gl" width="1920" height="1080"></canvas>
          <div id="ms"><span class="n">0.0</span><span class="u">ms</span></div>
        </div>
        <!-- 1 open -->
        <div id="s-open" class="scene">
          <div class="feet"><video id="v-liftoff" class="clip" src="assets/v/app-liftoff.mp4" muted playsinline data-start="3.6583" data-duration="1.4983" data-media-start="0" data-track-index="3"></video></div>
        </div>
        <!-- 2 convert -->
        <div id="s-convert" class="scene"></div>
        <!-- 3 paste -->
        <div id="s-paste" class="scene"></div>
        <!-- 4 speak -->
        <div id="s-speak" class="scene light"></div>
        <!-- 5 snap -->
        <div id="s-snap" class="scene">
          <div class="pane"><video id="v-p0" class="clip" src="assets/v/pour-streams.mp4" muted playsinline data-start="9.3" data-duration="1.05" data-media-start="0.1" data-track-index="4"></video></div>
          <div class="pane"><video id="v-p1" class="clip" src="assets/v/orbit-earth.mp4" muted playsinline data-start="9.3" data-duration="1.05" data-media-start="0.1" data-track-index="5"></video></div>
          <div class="pane"><video id="v-p2" class="clip" src="assets/v/engines-pad.mp4" muted playsinline data-start="9.3" data-duration="1.05" data-media-start="0.0" data-track-index="6"></video></div>
          <div class="pane"><video id="v-p3" class="clip" src="assets/v/crucible.mp4" muted playsinline data-start="9.3" data-duration="1.05" data-media-start="0.0" data-track-index="7"></video></div>
          <div class="pane"><video id="v-p4" class="clip" src="assets/v/interstage.mp4" muted playsinline data-start="9.3" data-duration="1.05" data-media-start="0.1" data-track-index="8"></video></div>
          <div class="pane"><video id="v-p5" class="clip" src="assets/v/pour-ladle.mp4" muted playsinline data-start="9.3" data-duration="1.05" data-media-start="0.1" data-track-index="9"></video></div>
        </div>
        <!-- 6 ask -->
        <div id="s-ask" class="scene"></div>
        <!-- end -->
        <div id="s-end" class="scene"></div>
      </div>

      <svg width="0" height="0" style="position:absolute">
        <defs>
          <filter id="brush" x="-5%" y="-5%" width="110%" height="110%">
            <feTurbulence type="fractalNoise" baseFrequency="0.04 0.55" numOctaves="2" seed="11" result="n" />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G" />
          </filter>
          <filter id="heatglow" x="-20%" y="-40%" width="140%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>
      </svg>

      <div id="whiteout"></div>
      <div id="grain"></div>

      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="15" data-track-index="20" data-volume="1"></audio>
    </div>

    <script src="js/data.js"></script>
    <script src="js/lib.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/zoom.js"></script>
    <script src="js/act1.js"></script>
    <script src="js/s-keys.js"></script>
    <script src="js/s-open.js"></script>
    <script src="js/s-convert.js"></script>
    <script src="js/s-paste.js"></script>
    <script src="js/s-speak.js"></script>
    <script src="js/s-snap.js"></script>
    <script src="js/s-ask.js"></script>
    <script src="js/s-end.js"></script>
    <script type="module" src="js/gl.js"></script>
    <script src="js/toff.js"></script>
    <script src="js/film.js"></script>
  </body>
</html>
