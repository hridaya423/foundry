name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lint
        run: |
          ./scripts/lint-lines.sh
          ./scripts/lint-design.sh
          ./scripts/lint-l10n.sh

      - name: Test (includes light-mode snapshot comparisons)
        run: swift test
