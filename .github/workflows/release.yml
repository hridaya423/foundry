name: Build and publish latest release

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: read

concurrency:
  group: latest-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      CODE_SIGN_IDENTITY: "-"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check signing secrets
        id: signing
        env:
          HAS_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          HAS_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID }}
          HAS_APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          HAS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$HAS_P12" && -n "$HAS_P12_PASSWORD" && -n "$HAS_APPLE_ID" && -n "$HAS_APPLE_PASSWORD" && -n "$HAS_TEAM_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are missing — building ad-hoc and skipping notarization. See docs/distribution.md."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="foundry-signing-${RUNNER_TEMP##*/}.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          P12_PATH="$RUNNER_TEMP/devid.p12"
          printf '%s' "$MACOS_DEVELOPER_ID_P12" | base64 --decode -o "$P12_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN" -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$P12_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          DEFAULT_KEYCHAINS="$(security list-keychain -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychain -d user -s "$KEYCHAIN" $DEFAULT_KEYCHAINS
          echo "CODE_SIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Run tests
        run: swift test

      - name: Build and verify app
        run: ./scripts/verify-packaging.sh

      - name: Package DMG
        run: ./scripts/package-dmg.sh

      - name: Notarize DMG
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/notarize-dmg.sh "build/Foundry-$(tr -d '[:space:]' < VERSION)-build-${BUILD_NUMBER}.dmg"

      - name: Archive app
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          asset="Foundry-${version}-build-${BUILD_NUMBER}.zip"
          ditto -c -k --sequesterRsrc --keepParent build/Foundry.app "$asset"
          printf '%s\n' "$version" > release-version

      - name: Upload app package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundry-release
          path: |
            Foundry-*.zip
            build/Foundry-*.dmg
            release-version
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: docs/release-notes
          path: source

      - name: Download app package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: foundry-release
          path: release

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < release/release-version)"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must contain a semantic version such as 1.0.0" >&2
            exit 1
          fi

          tag="v${version}"
          zip_asset="release/Foundry-${version}-build-${GITHUB_RUN_NUMBER}.zip"
          dmg_asset="release/build/Foundry-${version}-build-${GITHUB_RUN_NUMBER}.dmg"
          test -f "$zip_asset"
          test -f "$dmg_asset"

          cp "$dmg_asset" release/Foundry.dmg
          cp "$zip_asset" release/Foundry.zip
          assets=("$dmg_asset" "$zip_asset" release/Foundry.dmg release/Foundry.zip)

          title="Foundry ${version} (build ${GITHUB_RUN_NUMBER})"
          notes="$RUNNER_TEMP/release-notes.md"
          : > "$notes"
          if [[ "$SIGNED" != "true" ]]; then
            title="${title} UNSIGNED"
            {
              echo "> **Unsigned build.** This build is ad-hoc signed and not notarized. macOS Gatekeeper blocks it on other Macs."
              echo "> The Developer ID signing secrets were missing when it was built. See docs/distribution.md."
              echo
            } >> "$notes"
          fi
          notes_source="source/docs/release-notes/${version}.md"
          if [[ -f "$notes_source" ]]; then
            cat "$notes_source" >> "$notes"
          else
            echo "Automated build from commit ${GITHUB_SHA}. Download the .dmg, drag Foundry to Applications, then open the launcher with ⌘Space, or the shortcut you chose during setup." >> "$notes"
          fi
          {
            echo
            echo "Requires an Apple silicon Mac (arm64) running macOS 14 or later. Build ${GITHUB_RUN_NUMBER} from commit ${GITHUB_SHA}."
          } >> "$notes"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            keep=("${assets[@]##*/}")
            while IFS= read -r name; do
              if [[ ! " ${keep[*]} " =~ " ${name} " ]]; then
                gh release delete-asset "$tag" "$name" --repo "$GITHUB_REPOSITORY" --yes
              fi
            done < <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file "$notes" --latest
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$notes" \
              --latest
          fi
