name: Build and publish latest release

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: read

concurrency:
  group: latest-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      CODE_SIGN_IDENTITY: "-"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run tests
        run: swift test

      - name: Build and verify app
        run: ./scripts/verify-packaging.sh

      - name: Archive app
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          asset="Foundry-${version}-build-${BUILD_NUMBER}.zip"
          ditto -c -k --sequesterRsrc --keepParent build/Foundry.app "$asset"
          printf '%s\n' "$version" > release-version

      - name: Upload app package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundry-release
          path: |
            Foundry-*.zip
            release-version
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download app package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: foundry-release
          path: release

      - name: Replace versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < release/release-version)"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must contain a semantic version such as 1.0.0" >&2
            exit 1
          fi

          tag="v${version}"
          asset="release/Foundry-${version}-build-${GITHUB_RUN_NUMBER}.zip"
          test -f "$asset"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
          fi

          gh release create "$tag" "$asset" \
            --target "$GITHUB_SHA" \
            --title "Foundry ${version} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Automated build from commit ${GITHUB_SHA}." \
            --latest
